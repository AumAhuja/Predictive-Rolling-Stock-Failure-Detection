# Smart Train AI Fault Detection & Localization Configuration

window:
  size_seconds: 5.0
  overlap: 0.5

sampling:
  imu_hz: 100
  temperature_hz: 1
  electrical_hz: 10
  load_hz: 80
  resample_target_hz: 100

model:
  anomaly:
    contamination: 0.05
    n_estimators: 100
    random_state: 42

  classifier:
    type: xgboost
    n_estimators: 150
    max_depth: 6
    learning_rate: 0.05
    random_state: 42

  localization:
    type: xgboost
    n_estimators: 100
    max_depth: 5
    random_state: 42

data:
  random_seed: 42
  raw_dir: data/raw
  processed_dir: data/processed
  synthetic_dir: data/synthetic
  models_dir: models_artifacts
  reports_dir: reports

health:
  warning_threshold: 75
  critical_threshold: 50
  weights:
    anomaly: 0.30
    vibration: 0.25
    thermal: 0.20
    electrical: 0.15
    fault_confidence: 0.10
